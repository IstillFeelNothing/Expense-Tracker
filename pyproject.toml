[project]
name = "expense-tracker"
version = "0.1.0"
description = "Консольний трекер особистих витрат"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Корінь проєкту в sys.path: працюють `import app` і `from tests.fakes import ...`
# і при `pytest`, і при `python -m pytest`.
pythonpath = ["."]
addopts = "-ra"

# ---------- ruff ----------
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
# Довжину рядків контролює `ruff format`; довгі f-рядки з повідомленнями не ріжемо.
ignore = ["E501"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.10"
files = ["."]
exclude = ["^\\.venv/", "^venv/", "^build/"]
strict = true
warn_unreachable = true
